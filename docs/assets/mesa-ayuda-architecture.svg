<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Mesa de Ayuda 2.0</title>
  <desc id="desc">Flujo entre Login Universal, auth_service, Mesa de Ayuda y su API operativa.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>

    <linearGradient id="mesa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="login" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".34"/>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1400" height="650" rx="28" fill="url(#bg)"/>

  <text x="60" y="70" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="31" font-weight="800">Arquitectura del producto</text>
  <text x="60" y="103" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="15">Autenticación centralizada · sesión · dominio operativo</text>
  <line x1="60" y1="128" x2="1340" y2="128" stroke="#334155"/>

  <!-- Usuario -->
  <g filter="url(#shadow)">
    <rect x="54" y="250" width="170" height="88" rx="18" fill="#111c2d" stroke="#334155"/>
    <circle cx="95" cy="294" r="18" fill="#1e293b" stroke="#64748b"/>
    <circle cx="95" cy="287" r="6" fill="#cbd5e1"/>
    <path d="M83 309c3-9 21-9 24 0" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <text x="127" y="300" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="17" font-weight="700">Usuario</text>
  </g>

  <!-- Login -->
  <g filter="url(#shadow)">
    <rect x="310" y="216" width="250" height="155" rx="22" fill="url(#login)"/>
    <text x="435" y="257" text-anchor="middle" fill="#ffffff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">Login Universal</text>
    <text x="435" y="282" text-anchor="middle" fill="#e0e7ff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">:5174</text>
    <text x="435" y="317" text-anchor="middle" fill="#eef2ff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Login · MFA · accesos</text>
    <text x="435" y="341" text-anchor="middle" fill="#dbeafe"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">entrega redirect-code</text>
  </g>

  <!-- auth_service -->
  <g filter="url(#shadow)">
    <rect x="330" y="448" width="210" height="96" rx="20" fill="#0d2830" stroke="#155e75"/>
    <text x="435" y="486" text-anchor="middle" fill="#ffffff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">auth_service</text>
    <text x="435" y="512" text-anchor="middle" fill="#a5f3fc"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">:8001 · identidad y sesión</text>
  </g>

  <!-- Mesa -->
  <g filter="url(#shadow)">
    <rect x="690" y="205" width="280" height="177" rx="24" fill="url(#mesa)"/>
    <text x="830" y="249" text-anchor="middle" fill="#ffffff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">Mesa de Ayuda 2.0</text>
    <text x="830" y="276" text-anchor="middle" fill="#cffafe"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">:5173</text>
    <text x="830" y="312" text-anchor="middle" fill="#ecfeff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Dashboard · Atenciones</text>
    <text x="830" y="335" text-anchor="middle" fill="#ecfeff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Seguimiento · Organizador · Perfil</text>
    <text x="830" y="359" text-anchor="middle" fill="#bae6fd"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">access token en memoria</text>
  </g>

  <!-- API Mesa -->
  <g filter="url(#shadow)">
    <rect x="1080" y="225" width="250" height="137" rx="22" fill="url(#api)"/>
    <text x="1205" y="267" text-anchor="middle" fill="#ffffff"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">API Mesa de Ayuda</text>
    <text x="1205" y="293" text-anchor="middle" fill="#ffedd5"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">:8000</text>
    <text x="1205" y="326" text-anchor="middle" fill="#fff7ed"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">dominio operativo</text>
  </g>

  <!-- conexiones -->
  <path d="M224 294H310" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="266" y="277" text-anchor="middle" fill="#64748b"
    font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">acceso</text>

  <path d="M560 294H690" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="574" y="267" width="103" height="28" rx="14" fill="#201b34" stroke="#6d5ac8"/>
  <text x="625" y="286" text-anchor="middle" fill="#c4b5fd"
    font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">redirect-code</text>

  <path d="M435 371V448" stroke="#67e8f9" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M465 448V371" stroke="#67e8f9" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="488" y="414" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="11">login · MFA · sesión</text>

  <path d="M830 382V454H585V496H540" stroke="#67e8f9" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <text x="710" y="441" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif"
    font-size="11">exchange-code · /users/me</text>

  <path d="M970 294H1080" stroke="#fdba74" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="1025" y="276" text-anchor="middle" fill="#fdba74"
    font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">datos operativos</text>

  <!-- principios -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="676" y="457" width="654" height="112" rx="20" fill="#0d1522" stroke="#273449"/>
    <text x="704" y="489" fill="#e2e8f0" font-size="14" font-weight="800">Principios de integración</text>

    <circle cx="705" cy="521" r="5" fill="#22d3ee"/>
    <text x="720" y="525" fill="#94a3b8" font-size="12">Login separado del dominio operativo</text>

    <circle cx="705" cy="548" r="5" fill="#34d399"/>
    <text x="720" y="552" fill="#94a3b8" font-size="12">Backend como autoridad final</text>

    <circle cx="1000" cy="521" r="5" fill="#c4b5fd"/>
    <text x="1015" y="525" fill="#94a3b8" font-size="12">Entrada mediante redirect-code</text>

    <circle cx="1000" cy="548" r="5" fill="#f59e0b"/>
    <text x="1015" y="552" fill="#94a3b8" font-size="12">Access token sólo en memoria</text>
  </g>
</svg>
