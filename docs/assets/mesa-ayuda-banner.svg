    <rect x="186" y="111" width="44" height="8" rx="4" fill="#C4B5FD"/>
    <rect x="186" y="128" width="88" height="10" rx="5" fill="#F8FAFC" fill-opacity="0.88"/>
    <rect x="40" y="187" width="120" height="9" rx="4.5" fill="#F8FAFC" fill-opacity="0.88"/>
    <rect x="40" y="205" width="222" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.72"/>
