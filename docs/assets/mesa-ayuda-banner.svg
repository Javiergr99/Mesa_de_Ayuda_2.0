<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Mesa de Ayuda 2.0</title>
  <desc id="desc">Plataforma para registrar, organizar y dar seguimiento a solicitudes de atención.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.58" stop-color="#111C35"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#611232"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9D2449" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9D2449" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1440" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="255" cy="128" rx="360" ry="270" fill="url(#glowBlue)"/>
  <ellipse cx="1280" cy="355" rx="390" ry="280" fill="url(#glowWine)"/>

  <g transform="translate(84 74)" filter="url(#shadow)">
    <rect width="86" height="86" rx="24" fill="#2563EB"/>
    <path d="M26 43h12l7-18 11 36 7-18h11" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#FFFFFF">
    <text x="198" y="117" font-size="22" font-weight="700" letter-spacing="2.4">PLATAFORMA INSTITUCIONAL</text>
    <text x="84" y="224" font-size="68" font-weight="800" letter-spacing="-2.4">Mesa de Ayuda 2.0</text>
    <text x="88" y="270" font-size="23" font-weight="400" fill="#CBD5E1">Autenticación segura, gestión centralizada y seguimiento trazable.</text>
  </g>

  <g transform="translate(88 316)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650">
    <g>
      <rect width="190" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="27" cy="24" r="7" fill="#60A5FA"/>
      <text x="46" y="30" fill="#E2E8F0">Autenticación 2FA</text>
    </g>
    <g transform="translate(206 0)">
