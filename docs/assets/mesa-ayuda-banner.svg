      <circle cx="27" cy="24" r="7" fill="#34D399"/>
      <text x="46" y="30" fill="#E2E8F0">Gestión de atenciones</text>
    </g>
    <g transform="translate(412 0)">
      <rect width="170" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="27" cy="24" r="7" fill="#C4B5FD"/>
      <text x="46" y="30" fill="#E2E8F0">Design System</text>
